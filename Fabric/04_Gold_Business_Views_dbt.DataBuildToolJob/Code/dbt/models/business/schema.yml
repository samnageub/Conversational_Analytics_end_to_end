  columns:
  - name: TestCenterKey
    description: Test-center relationship key.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('TestCenter')
          field: TestCenterKey
  - name: PlanningDateKey
    description: Planning-date relationship key.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('Calendar')
          field: DateKey
  - name: PhysicalCapacity
    description: Planned physical capacity.
    data_tests:
    - not_null
  - name: PlannedDemand
    description: Planned demand.
    data_tests:
    - not_null
  - name: CapacityGap
    description: Planned capacity gap.
    data_tests:
    - not_null
  - name: PlanningStatus
    description: Capacity planning status.
  - name: ProctorsScheduled
    description: Proctors scheduled.
    data_tests:
    - not_null
  - name: ProctorsAbsent
    description: Proctors absent.
    data_tests:
    - not_null
  - name: ProctorsAvailable
    description: Proctors available.
    data_tests:
    - not_null
  - name: ProctorsRequired
    description: Proctors required.
    data_tests:
    - not_null
  - name: StaffingGap
    description: Staffing gap.
    data_tests:
    - not_null
  - name: IsUnderstaffed
    description: Understaffed indicator.
    data_tests:
    - not_null
  - name: StaffingCoverageRate
    description: Available divided by required proctors.
  - name: CapacityStaffingDayCount
    description: Additive capacity/staffing-day row counter.
    data_tests:
    - not_null
