    description: City.
  - name: state
    description: State/region subdivision.
  - name: region
    description: Operating region.
  - name: base_daily_capacity
    description: Configured base daily capacity.
  - name: test_center_status
    description: Test center status.
- name: dim_date
  description: 'Calendar dimension. Grain: one row per date_key.'
  columns:
  - name: date_key
    description: Integer date key in YYYYMMDD form.
    data_tests:
    - unique
    - not_null
  - name: calendar_date
    description: Calendar date.
    data_tests:
    - unique
    - not_null
  - name: calendar_year
    description: Calendar year.
    data_tests:
    - not_null
  - name: calendar_quarter
    description: Calendar quarter.
  - name: month_number
    description: Month number.
  - name: month_name
    description: Month name.
  - name: year_month
    description: Year-month label.
  - name: week_number
    description: Week number.
  - name: day_of_month
    description: Day of month.
  - name: day_name
    description: Day name.
  - name: is_weekend
    description: Weekend indicator.
- name: fact_registration
  description: 'Registration fact. Grain: one row per registration_id.'
  columns:
  - name: registration_id
    description: Degenerate registration identifier.
    data_tests:
    - unique
    - not_null
  - name: customer_key
    description: Foreign key to dim_customer.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: candidate_key
    description: Foreign key to dim_candidate.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_candidate')
          field: candidate_key
  - name: program_key
    description: Foreign key to dim_program.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_program')
          field: program_key
  - name: assessment_key
    description: Foreign key to dim_assessment.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_assessment')
          field: assessment_key
  - name: test_center_key
    description: Foreign key to dim_test_center.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_test_center')
          field: test_center_key
  - name: registration_date_key
    description: Foreign key to dim_date.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: original_exam_date_key
    description: Foreign key to dim_date.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: final_exam_date_key
    description: Foreign key to dim_date.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_date')
          field: date_key
  - name: registration_status
    description: Registration status.
    data_tests:
    - not_null
  - name: delivery_mode
    description: Delivery mode.
  - name: was_rescheduled
    description: Reschedule indicator.
    data_tests:
    - not_null
  - name: reschedule_count
    description: Number of reschedules.
    data_tests:
    - not_null
  - name: days_shifted
    description: Days between original and final exam dates.
    data_tests:
    - not_null
  - name: registration_count
    description: Additive row counter.
    data_tests:
    - not_null
