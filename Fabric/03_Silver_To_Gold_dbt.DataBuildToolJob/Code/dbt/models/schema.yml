    - not_null
  - name: customer_key
    description: Owning customer key.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: program_code
    description: Program business code.
    data_tests:
    - not_null
  - name: program_name
    description: Program name.
    data_tests:
    - not_null
  - name: program_category
    description: Program category.
  - name: program_status
    description: Program status.
- name: dim_assessment
  description: 'Assessment dimension. Grain: one row per assessment_key.'
  columns:
  - name: assessment_key
    description: Stable natural dimensional key derived from Silver assessment_id.
    data_tests:
    - unique
    - not_null
  - name: customer_key
    description: Owning customer key.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: program_key
    description: Owning program key.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_program')
          field: program_key
  - name: assessment_code
    description: Assessment business code.
    data_tests:
    - not_null
  - name: assessment_name
    description: Assessment name.
    data_tests:
    - not_null
  - name: assessment_level
    description: Assessment level.
  - name: passing_score
    description: Passing score.
  - name: standard_duration_minutes
    description: Standard test duration.
  - name: standard_price
    description: Standard list price.
  - name: assessment_status
    description: Assessment status.
- name: dim_topic
  description: 'Topic dimension. Grain: one row per topic_key.'
  columns:
  - name: topic_key
    description: Stable natural dimensional key derived from Silver topic_id.
    data_tests:
    - unique
    - not_null
  - name: topic_name
    description: Topic name.
    data_tests:
    - not_null
  - name: topic_description
    description: Topic description.
  - name: topic_status
    description: Topic status.
- name: dim_item
  description: 'Item dimension. Grain: one row per item_key.'
  columns:
  - name: item_key
    description: Stable natural dimensional key derived from Silver item_id.
    data_tests:
    - unique
    - not_null
  - name: topic_key
    description: Parent topic key.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_topic')
          field: topic_key
  - name: item_name
    description: Item name.
    data_tests:
    - not_null
  - name: difficulty
    description: Difficulty band.
  - name: maximum_points
    description: Maximum points.
  - name: item_status
    description: Item status.
- name: dim_test_center
  description: 'Test center dimension. Grain: one row per test_center_key.'
  columns:
  - name: test_center_key
    description: Stable natural dimensional key derived from Silver test_center_code.
    data_tests:
    - unique
    - not_null
  - name: test_center_name
    description: Test center name.
    data_tests:
    - not_null
