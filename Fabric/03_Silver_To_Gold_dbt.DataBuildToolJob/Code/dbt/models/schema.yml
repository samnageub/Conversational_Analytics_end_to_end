version: 2
models:
- name: dim_customer
  description: 'Customer dimension. Grain: one row per customer_key.'
  columns:
  - name: customer_key
    description: Stable natural dimensional key derived from Silver customer_id.
    data_tests:
    - unique
    - not_null
  - name: customer_name
    description: Customer display name.
    data_tests:
    - not_null
  - name: customer_segment
    description: Customer segment.
  - name: country
    description: Customer country.
  - name: customer_status
    description: Customer status.
- name: dim_candidate
  description: 'Candidate dimension. Grain: one row per candidate_key.'
  columns:
  - name: candidate_key
    description: Stable natural dimensional key derived from Silver candidate_id.
    data_tests:
    - unique
    - not_null
  - name: customer_key
    description: Owning customer key.
    data_tests:
    - not_null
    - relationships:
        arguments:
          to: ref('dim_customer')
          field: customer_key
  - name: candidate_display_name
    description: Candidate display name.
  - name: region_code
    description: Candidate region code.
  - name: region_name
    description: Candidate region name.
  - name: candidate_status
    description: Candidate status.
- name: dim_program
  description: 'Program dimension. Grain: one row per program_key.'
  columns:
  - name: program_key
    description: Stable natural dimensional key derived from Silver program_id.
    data_tests:
